name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses6 libncurses6:i386 libtinfo6 \
            cmake libffi-dev libssl-dev

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install python dependencies
        run: |
          pip install buildozer cython
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fix buildozer.spec android.api if invalid
        run: |
          python - << 'PY'
          from pathlib import Path
          p = Path('buildozer.spec')
          text = p.read_text(encoding='utf-8')
          lines = text.splitlines()
          out = []
          found = False
          for line in lines:
              if line.strip().startswith('android.api'):
                  out.append('android.api = 31')
                  found = True
              else:
                  out.append(line)
          if not found:
              out.append('android.api = 31')
          p.write_text('\n'.join(out) + '\n', encoding='utf-8')
          print('buildozer.spec fixed: android.api=31')
          PY

      - name: Build APK (debug)
        run: |
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: brawlstats-apk
          path: bin/*.apk
          if-no-files-found: error
